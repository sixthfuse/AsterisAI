<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asteris Advisor v3 Lab</title>
    <link rel="stylesheet" href="/static/advisor-v2.css?v=v3-reset">
    <script src="/static/advisor-v3.js?v=v3-reset" defer></script>
  </head>
  <body>
    <main class="lab-shell">
      <header>
        <div><span class="badge">V3 EXPERIMENT</span><h1>Asteris Advisor v3 Lab</h1></div>
        <p>One typed planning pipeline, authoritative catalog evidence, and deterministic academic rules.</p>
      </header>
      <section id="messages" class="messages" aria-live="polite">
        <article class="assistant"><p>Ask about a BCIT program, course, campus, international availability, or admission eligibility.</p></article>
      </section>
      <form id="chat-form">
        <label for="question">Question</label>
        <div class="composer">
          <textarea id="question" rows="2" maxlength="2000" placeholder="Try: computing" required></textarea>
          <button id="send" type="submit">Send</button>
        </div>
      </form>
      <footer>
        <span id="status">V3 uses an isolated session and read-only academic data.</span>
        <button id="clear" type="button">New session</button>
      </footer>
    </main>
  </body>
</html>
